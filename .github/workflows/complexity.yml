name: Complexity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  complexity:
    name: Analyze Complexity
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Analyze complexity
        id: analysis
        # v1 tracks the latest stable v1.x release, and the default
        # `version: latest` input follows the latest released binaries.
        uses: fummicc1/swift-complexity@v1
        with:
          paths: Sources
          threshold: "10"
          # Hard gate: the build fails when any function reaches the
          # threshold. Suppress intentional complexity inline with
          # `// swift-complexity:disable` instead of loosening this.
          fail-on-threshold: "true"

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.analysis.outputs.report-file }}
