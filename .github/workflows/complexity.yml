name: Complexity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  complexity:
    name: Analyze Complexity
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Analyze complexity
        id: analysis
        uses: fummicc1/swift-complexity@v1.2.0
        with:
          # Pinned explicitly: "latest" resolves to 1.1.0 while v1.2.0 is a
          # pre-release, and only 1.2.0+ ships self-contained Linux binaries.
          version: "1.2.0"
          paths: Sources
          threshold: "10"
          # Hard gate: the build fails when any function reaches the
          # threshold. Suppress intentional complexity inline with
          # `// swift-complexity:disable` instead of loosening this.
          fail-on-threshold: "true"

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.analysis.outputs.report-file }}
